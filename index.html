<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Quran Kareem</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <h1 class="main-title">القرآن الكريم</h1>
            <p class="subtitle">استمع إلى القرآن الكريم</p>
        </header>

        <!-- Loading Spinner -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="main-content" style="display: none;">
            <!-- Surah Selector -->
            <div class="surah-selector-container">
                <label for="surah-select" class="selector-label">اختر السورة:</label>
                <select id="surah-select" class="surah-select">
                    <option value="">-- اختر السورة --</option>
                </select>
            </div>

            <!-- Reciter Selector -->
            <div class="reciter-selector-container">
                <label for="reciter-select" class="selector-label">اختر القارئ:</label>
                <select id="reciter-select" class="reciter-select">
                    <option value="Husary_128kbps">محمود خليل الحصري</option>
                    <option value="Alafasy_128kbps">مشاري العفاسي</option>
                    <option value="Abdul_Basit_Mujawwad_128kbps">عبد الباسط عبد الصمد</option>
                    <option value="Abdurrahmaan_As-Sudais_192kbps">عبد الرحمن السديس</option>
                    <option value="Abu_Bakr_Ash-Shaatree_128kbps">أبو بكر الشاطري</option>
                    <option value="Ahmed_ibn_Ali_al-Ajamy_128kbps">أحمد العجمي</option>
                    <option value="Ghamadi_40kbps">سعد الغامدي</option>
                    <option value="Muhammad_Ayyoub_128kbps">محمد أيوب</option>
                    <option value="Minshawy_Murattal_128kbps">محمد صديق المنشاوي</option>
                </select>
            </div>

            <!-- Surah Info -->
            <div id="surah-info" class="surah-info" style="display: none;">
                <h2 id="surah-name" class="surah-name"></h2>
                <p id="surah-details" class="surah-details"></p>
            </div>

            <!-- Audio Player -->
            <div id="audio-player-container" class="audio-player-container" style="display: none;">
                <div class="player-wrapper">
                    <div class="audio-controls">
                        <button id="play-pause" class="control-btn play-pause-btn" title="تشغيل/إيقاف">
                            <svg id="play-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg id="pause-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="progress-section">
                        <div class="progress-container">
                            <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                        </div>
                        <div class="time-info">
                            <span id="current-time" class="time">0:00</span>
                            <span id="duration" class="time">0:00</span>
                        </div>
                    </div>
                </div>
                <div class="playback-info">
                    <div class="current-ayah-info">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span id="current-ayah-number">جاهز للتشغيل</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 القرآن الكريم - جميع الحقوق محفوظة</p>
            <p class="api-credit">مدعوم بواسطة <a href="https://alquran.cloud/api" target="_blank">Al-Quran Cloud API</a></p>

            <div class="developer-info">
                <p class="developer-title">Developed by Mohamed Alsariti</p>
                <div class="social-links">
                    <a href="https://sariti.tech" target="_blank" rel="noopener noreferrer" class="social-link" title="Website">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm.25 5h3.5L12 8.75 8.25 5h3.5zm7.5 10a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm-15 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
                        </svg>
                        Sariti.tech
                    </a>
                    <a href="https://www.facebook.com/mohamed.el.seraty.2025" target="_blank" rel="noopener noreferrer" class="social-link" title="Facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Facebook
                    </a>
                    <a href="https://wa.me/201558282586" target="_blank" rel="noopener noreferrer" class="social-link" title="WhatsApp">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                        WhatsApp
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <script src="script.js"></script>
</body>
</html>
