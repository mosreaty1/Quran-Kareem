<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Quran Kareem</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <h1 class="main-title">القرآن الكريم</h1>
            <p class="subtitle">استمع إلى القرآن الكريم</p>
        </header>

        <!-- Loading Spinner -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="main-content" style="display: none;">
            <!-- Surah Selector -->
            <div class="surah-selector-container">
                <label for="surah-select" class="selector-label">اختر السورة:</label>
                <select id="surah-select" class="surah-select">
                    <option value="">-- اختر السورة --</option>
                </select>
            </div>

            <!-- Reciter Selector -->
            <div class="reciter-selector-container">
                <label for="reciter-select" class="selector-label">اختر القارئ:</label>
                <select id="reciter-select" class="reciter-select">
                    <option value="ar.alafasy">مشاري العفاسي</option>
                    <option value="ar.abdulbasitmurattal">عبد الباسط عبد الصمد (مرتل)</option>
                    <option value="ar.abdullahbasfar">عبد الله بصفر</option>
                    <option value="ar.abdurrahmaansudais">عبد الرحمن السديس</option>
                    <option value="ar.shaatree">أبو بكر الشاطري</option>
                    <option value="ar.husary">محمود خليل الحصري</option>
                    <option value="ar.minshawi">محمد صديق المنشاوي</option>
                    <option value="ar.muhammadayyoub">محمد أيوب</option>
                    <option value="ar.hudhaify">علي الحذيفي</option>
                </select>
            </div>

            <!-- Surah Info -->
            <div id="surah-info" class="surah-info" style="display: none;">
                <h2 id="surah-name" class="surah-name"></h2>
                <p id="surah-details" class="surah-details"></p>
            </div>

            <!-- Audio Player -->
            <div id="audio-player-container" class="audio-player-container" style="display: none;">
                <div class="player-wrapper">
                    <div class="audio-controls">
                        <button id="play-pause" class="control-btn play-pause-btn" title="تشغيل/إيقاف">
                            <svg id="play-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg id="pause-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="progress-section">
                        <div class="progress-container">
                            <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                        </div>
                        <div class="time-info">
                            <span id="current-time" class="time">0:00</span>
                            <span id="duration" class="time">0:00</span>
                        </div>
                    </div>
                </div>
                <div class="playback-info">
                    <div class="current-ayah-info">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span id="current-ayah-number">جاهز للتشغيل</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 القرآن الكريم - جميع الحقوق محفوظة</p>
            <p class="api-credit">مدعوم بواسطة <a href="https://alquran.cloud/api" target="_blank">Al-Quran Cloud API</a></p>
        </footer>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <script src="script.js"></script>
</body>
</html>
