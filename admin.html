<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Admin Dashboard</title>

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-login {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
        }
        .admin-container {
            max-width: 1200px;
            margin: 20px auto;
            display: none;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }
        .upload-form {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-light);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-danger {
            background: #dc2626;
            color: var(--text-light);
        }
        .btn-logout {
            background: #f59e0b;
            color: var(--text-dark);
        }
        .videos-list {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
        }
        .video-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .video-item img {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 8px;
        }
        .video-info {
            flex: 1;
        }
        .video-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .video-meta {
            font-size: 0.9rem;
            color: var(--text-gray);
        }
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="login-container" class="admin-login">
        <h2 style="text-align: center; margin-bottom: 30px; font-family: 'Amiri', serif;">لوحة تحكم الفيديوهات</h2>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="admin-password" placeholder="أدخل كلمة المرور">
        </div>
        <button onclick="login()" class="btn btn-primary" style="width: 100%;">تسجيل الدخول</button>
        <p id="login-error" style="color: #dc2626; margin-top: 15px; display: none; text-align: center;">كلمة مرور خاطئة</p>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-container" class="admin-container">
        <div class="admin-header">
            <h1 style="font-family: 'Amiri', serif; margin: 0;">إدارة الفيديوهات الإسلامية</h1>
            <button onclick="logout()" class="btn btn-logout">تسجيل الخروج</button>
        </div>

        <div id="alert-container"></div>

        <!-- Upload Form -->
        <div class="upload-form">
            <h2 style="font-family: 'Amiri', serif; margin-bottom: 25px;">إضافة فيديو جديد</h2>

            <div class="form-group">
                <label>عنوان الفيديو *</label>
                <input type="text" id="video-title" placeholder="مثال: سورة الفاتحة - قراءة خاشعة">
            </div>

            <div class="form-group">
                <label>الوصف *</label>
                <textarea id="video-description" placeholder="وصف مختصر عن الفيديو"></textarea>
            </div>

            <div class="form-group">
                <label>القسم *</label>
                <select id="video-category">
                    <option value="quran">القرآن الكريم</option>
                    <option value="hadith">الحديث الشريف</option>
                    <option value="fiqh">الفقه</option>
                    <option value="seerah">السيرة النبوية</option>
                    <option value="dua">الأدعية</option>
                </select>
            </div>

            <div class="form-group">
                <label>نوع الفيديو *</label>
                <select id="video-type" onchange="toggleVideoInput()">
                    <option value="youtube">فيديو YouTube</option>
                    <option value="url">رابط فيديو خارجي (MP4, etc.)</option>
                </select>
            </div>

            <div class="form-group" id="youtube-input">
                <label>معرف فيديو YouTube *</label>
                <input type="text" id="youtube-id" placeholder="مثال: dQw4w9WgXcQ">
                <small style="color: var(--text-gray);">الجزء بعد watch?v= في رابط YouTube</small>
            </div>

            <div class="form-group" id="url-input" style="display: none;">
                <label>رابط الفيديو المباشر *</label>
                <input type="url" id="video-url" placeholder="https://example.com/video.mp4">
                <small style="color: var(--text-gray);">رابط مباشر لملف الفيديو (MP4، WebM، etc.)</small>
            </div>

            <div class="form-group">
                <label>رابط صورة مصغرة (اختياري)</label>
                <input type="url" id="thumbnail-url" placeholder="https://example.com/image.jpg">
                <small style="color: var(--text-gray);">سيتم إنشاء صورة افتراضية إذا تركت فارغاً</small>
            </div>

            <button onclick="addVideo()" class="btn btn-primary">إضافة الفيديو</button>
        </div>

        <!-- Videos List -->
        <div class="videos-list">
            <h2 style="font-family: 'Amiri', serif; margin-bottom: 25px;">الفيديوهات المضافة (<span id="videos-count">0</span>)</h2>
            <div id="videos-list"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
